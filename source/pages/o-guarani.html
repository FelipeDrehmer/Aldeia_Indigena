<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juruá</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="icon" type="image/png" href="../assets/images/logo_image.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <section class="relative w-full h-screen flex flex-col overflow-hidden bg-black heroSection">
        <div class="hidden lg:flex absolute left-0 top-0 h-full w-[50%] clip-diagonal z-10 items-center">
            <div class="px-10 py-16 max-w-lg">
                <h2 class="text-5xl font-extrabold tracking-widest text-orange-400 mb-1">CONHEÇA</h2>
                <h2 class="text-5xl font-extrabold tracking-widest text-white mb-6">O GUARANI</h2>
            </div>
        </div>
        <div class="lg:hidden flex flex-col justify-center items-center h-full z-10">
            <h2 class="text-4xl font-extrabold tracking-widest text-orange-400 mb-1">CONHEÇA</h2>
            <h2 class="text-4xl font-extrabold tracking-widest text-white mb-6">O GUARANI</h2>
        </div>
        <nav class="w-full flex items-center justify-between px-8 py-6 absolute top-0 left-0 z-20">
            <div class="flex items-center gap-4">
                <img src="../assets/images/logo_image.png" alt="Logo Juruá" class="h-10 w-auto"/>
                <span class="text-3xl font-bold text-white tracking-wide">JURUÁ</span>
            </div>
            <!-- Menu Desktop -->
            <ul class="hidden lg:flex items-center gap-8">
                <li><a href="home.html" class="animated-underline text-white text-lg font-light transition-all relative">HOME</a></li>
                <li><a href="semana-cultural.html" class="animated-underline text-white text-lg font-light transition-all relative">SEMANA CULTURAL</a></li>
                <li><a href="o-guarani.html" class="animated-underline text-white text-lg font-light transition-all relative">O GUARANI</a></li>
                <li><a href="galeria.html" class="animated-underline text-white text-lg font-light transition-all relative">GALERIA</a></li>
                <li><a href="dicionario.html" class="animated-underline text-white text-lg font-light transition-all relative">DICIONARIO</a></li>
            </ul>
            <!-- Botão Mobile (Hamburguer) -->
            <button id="menuToggle" aria-label="Abrir Menu" class="lg:hidden flex flex-col gap-1 focus:outline-none z-40 relative">
                <span class="w-6 h-[2px] bg-white transition-all origin-center"></span>
                <span class="w-6 h-[2px] bg-white transition-all origin-center"></span>
                <span class="w-6 h-[2px] bg-white transition-all origin-center"></span>
            </button>
        </nav>
        <!-- Menu Mobile -->
        <div id="mobileMenu" class="fixed top-0 left-0 w-full h-full bg-[#742E05]/90 backdrop-blur-sm z-30 flex flex-col items-center gap-8 pt-24 text-white text-2xl font-light transform translate-x-full transition-transform duration-300 ease-in-out">
            <a href="home.html" class="text-white text-lg font-light transition-all relative">HOME</a>
            <a href="semana-cultural.html" class="text-white text-lg font-light transition-all relative">SEMANA CULTURAL</a>
            <a href="o-guarani.html" class="text-white text-lg font-light transition-all relative">O GUARANI</a>
            <a href="galeria.html" class="text-white text-lg font-light transition-all relative">GALERIA</a>
            <a href="dicionario.html" class="text-white text-lg font-light transition-all relative">DICIONARIO</a>
        </div>
    </section>
    <script src="../scripts/main.js"></script>
</body>
</html>
