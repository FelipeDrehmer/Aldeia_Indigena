<!DOCTYPE html>
<html lang="pt-BR">

    <link rel="icon" type="image/png" href="../../assets/images/logo_image.png">

</head>
<body class="scroll-smooth">
    <div class="min-h-screen w-full bg-[#996c3b] flex flex-col">
        <!--Nav Bar-->
        <div class="w-full flex items-center justify-between px-8 py-4 z-50">
            <div class="flex items-center gap-4">
                <img src="../../assets/images/img_Logo.svg" alt="Logo Juruá" class="h-10 w-auto"/>
                <span class="text-3xl font-bold text-white tracking-wide">JURUÁ</span>
            </div>
            <!-- Menu Desktop -->
            <ul class="hidden lg:flex items-center gap-8">
                <li><a href="/source/pages/home-page/home.html" class="animated-underline text-white text-lg font-light transition-all relative">HOME</a></li>
                <li><a href="semana-cultural.html" class="animated-underline text-white text-lg font-light transition-all relative">SEMANA CULTURAL</a></li>
                <li><a href="/source/pages/guarani-page/o-guarani.html" class="animated-underline text-white text-lg font-light transition-all relative">O GUARANI</a></li>
                <li><a href="/source/pages/galeria-page/galeria.html" class="animated-underline text-white text-lg font-light transition-all relative">GALERIA</a></li>
                <li><a href="/source/pages/dicionario-page/dicionario.html" class="animated-underline text-white text-lg font-light transition-all relative">DICIONARIO</a></li> 
            </ul>
            <!-- Botão Mobile (Hamburguer) -->
            <button id="menuToggle" aria-label="Abrir Menu" class="lg:hidden flex flex-col gap-1 focus:outline-none z-40 relative">
                <span class="w-6 h-[2px] bg-white transition-all origin-center"></span>
                <span class="w-6 h-[2px] bg-white transition-all origin-center"></span>
                <span class="w-6 h-[2px] bg-white transition-all origin-center"></span>
            </button>
        </div>
        <!-- Seção principal  -->
        <section class="h-[90vh] mx-6 lg:mx-6 flex flex-col overflow-hidden heroSection rounded-lg static">
            <div class="hidden lg:flex absolute left-0 top-0 h-full w-[50%] z-10 items-center">
                <div class="px-10 py-16 bg-[#1c3d16]/70 rounded-r-xl absolute left-0">
                    <h2 class="text-8xl font-extrabold tracking-widest text-orange-400 mb-1">SEMANA</h2>
                    <h2 class="text-8xl font-extrabold tracking-widest text-white mb-6">CULTURAL</h2>
                </div>
            </div>
            <div class="lg:hidden relative flex justify-center items-center h-full z-10">
                <div class="clip-diagonal-quadrado flex flex-col justify-center items-center p-6">
                    <h2 class="text-3xl font-extrabold tracking-widest text-orange-400 mb-1">SEMANA</h2>
                    <h2 class="text-3xl font-extrabold tracking-widest text-white">CULTURAL</h2>
                </div>
            </div>
            <!-- Menu Mobile -->
            <div id="mobileMenu" class="fixed top-0 left-0 w-full h-full bg-[#742E05]/90 backdrop-blur-sm z-30 flex flex-col items-center gap-8 pt-24 text-white text-2xl font-light transform translate-x-full transition-transform duration-300 ease-in-out">
                <a href="/source/pages/home-page/home.html" class="text-white text-lg font-light transition-all relative">HOME</a>
                <a href="semana-cultural.html" class="text-white text-lg font-light transition-all relative">SEMANA CULTURAL</a>
                <a href="/source/pages/guarani-page/o-guarani.html" class="text-white text-lg font-light transition-all relative">O GUARANI</a>
                <a href="/source/pages/galeria-page/galeria.html" class="text-white text-lg font-light transition-all relative">GALERIA</a>
                <a href="/source/pages/dicionario-page/dicionario.html" class="text-white text-lg font-light transition-all relative">DICIONARIO</a>
            </div>
        </section>
    </div>

    <section id="eventoPrincipal" class="py-10 lg:px-6">
        <h2 id="tituloGeral" class="font-extrabold tracking-widest text-orange-400 mb-10 text-3xl lg:text-5xl text-center"></h2>
        <div class="max-w-[90%] lg:max-w-[70%] mx-auto flex flex-col lg:flex-row gap-10 items-center">  
            <div class="flex-1">
                <div class="w-full h-[300px] rounded-lg shadow-md overflow-hidden lg:h-[600px]">
                    <iframe
                        class="w-full h-full"
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7235.22354133619!2d-54.105295153763365!3d-24.9452922402257!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f40a156e5ec663%3A0x7042238423d34286!2sDiamante%20D'Oeste%2C%20PR%2C%2085896-000!5e0!3m2!1spt-PT!2sbr!4v1761656014399!5m2!1spt-PT!2sbr"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center text-black gap-16">
                <div id="descricaoGeral" class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full"></div>
                <button class="bg-[#742E05] text-white px-6 py-4 rounded-md w-[250px] hover:bg-orange-700 transition">
                    INSCREVER-SE
                </button>
            </div>
        </div>
    </section>

    <div id="container-blocos" class="bg-[#D6C0A4] mt-20"></div>
    
    <script src="../../scripts/main.js"></script>
    <script src="./semana-cultural.js"></script>

</html>
